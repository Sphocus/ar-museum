<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exhibition</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#f4f1ea;--card:#fff;--text:#1f1d1a;--muted:#6d6860;--accent:#8c2f39;--line:#e2ddd3}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#232120;--text:#f2efe9;--muted:#a39e95;--accent:#e08a93;--line:#38352f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Georgia,serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 6px}
.muted{color:var(--muted);font-family:system-ui,sans-serif;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;font-family:system-ui,sans-serif}
ol{padding-left:20px;margin:8px 0}li{margin:6px 0}
button.go{display:block;width:100%;margin-top:16px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 24px;font:600 1.05rem system-ui;cursor:pointer}
button.go:disabled{opacity:.6}
a{color:var(--accent);font-family:system-ui,sans-serif}
#xr-ui{display:none;position:fixed;inset:0;pointer-events:none;color:#fff;font-family:system-ui,sans-serif}
#xr-hint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;text-align:center;background:rgba(0,0,0,.65);padding:10px 14px;border-radius:12px}
#xr-bar{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;pointer-events:auto}
#xr-info{display:none;position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:45vh;overflow:auto;background:rgba(0,0,0,.8);border-radius:14px;padding:14px 16px;pointer-events:auto}
#xr-info b{display:block;font-size:17px;margin-bottom:4px;padding-right:56px}
#xr-info p{margin:6px 0 0;font-size:14px;line-height:1.45;color:#e8e8e8;overflow-wrap:anywhere;white-space:pre-wrap}
#xr-info button{position:absolute;top:8px;right:8px;font:600 14px system-ui;padding:8px 14px;border:0;border-radius:999px;background:rgba(255,255,255,.2);color:#fff}
#xr-bar button{font:600 15px system-ui;padding:12px 18px;border:0;border-radius:999px;background:rgba(0,0,0,.7);color:#fff}
</style>
</head>
<body>
<main id="app"><h1>Exhibition</h1><p class="muted">Loading…</p></main>
<div id="xr-ui">
  <div id="xr-hint"></div>
  <div id="xr-info"><button id="i-close">Close</button><b id="i-title"></b><p id="i-desc"></p></div>
  <div id="xr-bar"><button id="e-centre">Re-centre</button><button id="e-exit">Exit</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// Optional per-exhibit "solid": true stops see-through (blended) materials from showing parts of the model through each other.
const solid=(o,ex)=>{if(ex.solid)o.traverse(c=>{if(c.isMesh)[].concat(c.material).forEach(m=>{m.transparent=false;m.depthWrite=true;m.alphaTest=0.5;m.needsUpdate=true})})};
// Lowest point of a model at its current pose. Skinned (animated) models are measured on their real posed vertices, because a plain bounding box can be wrong for them.
function lowestY(o){o.updateMatrixWorld(true);let m=Infinity;const v=new THREE.Vector3();
  try{o.traverse(c=>{if(c.isSkinnedMesh&&c.applyBoneTransform){c.skeleton.update();const p=c.geometry.attributes.position;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.applyBoneTransform(i,v);v.applyMatrix4(c.matrixWorld);if(v.y<m)m=v.y}}else if(c.isMesh){const y=new THREE.Box3().setFromObject(c).min.y;if(y<m)m=y}})}catch(e){m=Infinity}
  if(!isFinite(m))m=new THREE.Box3().setFromObject(o).min.y;return m}
// Box of a model in its own space, measured on the real posed vertices of its skinned (animated) parts. Returns null for models with none.
// Three.js's built-in Box3 can be far too big for skinned models that are scaled (e.g. Bender at scale 2), so those are measured here.
function skinnedBox(o){let has=false;o.traverse(c=>{if(c.isSkinnedMesh&&c.applyBoneTransform)has=true});if(!has)return null;
  o.updateMatrixWorld(true);const box=new THREE.Box3(),v=new THREE.Vector3(),inv=o.matrixWorld.clone().invert();
  try{o.traverse(c=>{
    if(c.isSkinnedMesh&&c.applyBoneTransform){c.skeleton.update();const p=c.geometry.attributes.position;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.applyBoneTransform(i,v);v.applyMatrix4(c.matrixWorld).applyMatrix4(inv);box.expandByPoint(v)}}
    else if(c.isMesh)box.union(new THREE.Box3().setFromObject(c).applyMatrix4(inv));
  })}catch(e){return null}
  return box.isEmpty()?null:box}
const boxOf=(o,lbox)=>{if(lbox){o.updateMatrixWorld(true);return lbox.clone().applyMatrix4(o.matrixWorld)}return new THREE.Box3().setFromObject(o)};   // the model's box in the room, at its current size and position
// Soft shadow under a model: a dark, feathered ellipse lying flat at the model's lowest point, so it looks planted instead of floating.
let shadowTex=null;
function shadowTexture(){if(shadowTex)return shadowTex;const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(0,0,0,0.6)');r.addColorStop(0.45,'rgba(0,0,0,0.32)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);shadowTex=new THREE.CanvasTexture(c);return shadowTex}
function makeShadow(){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:shadowTexture(),transparent:true,depthWrite:false}));m.renderOrder=-1;m.visible=false;return m}
function setShadow(sh,box,floorY){   // box: the model's box in the room; floorY: height of its lowest point
  const sx=box.max.x-box.min.x,sz=box.max.z-box.min.z;
  if(!(sx>0&&sz>0&&isFinite(sx)&&isFinite(sz)&&isFinite(floorY))){sh.visible=false;return}
  const w=Math.max(0.25,sx*1.35),d=Math.max(0.25,sz*1.35);
  sh.scale.set(w,1,d);sh.position.set((box.min.x+box.max.x)/2,floorY+0.003,(box.min.z+box.max.z)/2);
  sh.material.opacity=Math.max(0.35,Math.min(1,3/Math.max(w,d)));   // very large models get a fainter shadow
  sh.visible=true}
const app=document.getElementById('app'),ui=document.getElementById('xr-ui'),hint=document.getElementById('xr-hint');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfg=null,cur=null,exh=null,isDraft=false;   // isDraft: a test run of a gallery that is not saved yet (from the gallery maker)   // exh = the exhibition being shown (name, description, layout)
// Several exhibitions: cfg.exhibitions = [{id,name,description,layout}]. An older file with one top-level "layout" still works as a single exhibition.
function getExhibitions(c){
  if(Array.isArray(c.exhibitions)&&c.exhibitions.length)return c.exhibitions;
  if(c.layout&&c.layout.length)return [{id:'main',name:c.exhibitionName||c.museumName||'Exhibition',layout:c.layout}];
  return [];
}

let hintTimer=null;
// Show a message at the top. With ms it fades after that long so it does not block the view; without, it stays until replaced.
function say(t,ms){hint.textContent=t;hint.style.display='block';clearTimeout(hintTimer);if(ms)hintTimer=setTimeout(()=>{hint.style.display='none'},ms)}
document.getElementById('xr-bar').addEventListener('beforexrselect',e=>e.preventDefault());
const infoBox=document.getElementById('xr-info');
infoBox.addEventListener('beforexrselect',e=>e.preventDefault());
// The info card for a model the visitor tapped: its title, then its description (credit and licence).
function showInfo(ex){
  document.getElementById('i-title').textContent=ex.title||ex.id;
  const d=document.getElementById('i-desc');d.textContent=ex.description||'';d.style.display=ex.description?'block':'none';
  infoBox.scrollTop=0;infoBox.style.display='block';
}
function hideInfo(){infoBox.style.display='none'}
document.getElementById('i-close').onclick=hideInfo;
document.getElementById('e-exit').onclick=()=>{if(cur)cur.session.end()};
// Re-centre: keep everything on screen and move the whole exhibition so its start spot is where you stand now,
// opening in the direction you are facing. No aiming needed; floor height stays as it was.
document.getElementById('e-centre').onclick=()=>{
  if(!cur||!cur.placed||!cur.cam){say('Place the exhibition first (aim at the floor and tap).');return}
  // Some exhibitions (a real, marked space) only allow re-centring near the start spot: otherwise send the visitor back to it.
  if(exh&&exh.recentreAtStart){
    const d=Math.hypot(cur.cam.x-cur.base.ox,cur.cam.z-cur.base.oz);
    if(d>RETURN_DIST){cur.showStart();say('You are about '+d.toFixed(1)+' m from the start spot. Walk back to the blue circle and face the way the arrow points, then tap Re-centre.',10000);return}
  }
  // Only accept the tap when the phone is held up and looking out: within about 60 degrees of level (looking up or down).
  const f=cur.fwd,l=Math.hypot(f.x,f.z);
  if(l<MIN_LEVEL){say('Raise your phone a little and look ahead, the way the exhibition should open, then tap Re-centre.',7000);return}
  cur.base={ox:cur.cam.x,oy:cur.base.oy,oz:cur.cam.z,th:Math.atan2(-f.x/l,-f.z/l)};
  cur.layoutAll();cur.markerUntil=0;
  say('Re-centred: the start spot is now where you stand, opening the way you face.',6000);
};
const RETURN_DIST=2;   // metres from the start spot beyond which Re-centre asks the visitor to walk back (only for exhibitions with recentreAtStart)
const MIN_LEVEL=0.5;   // cos(60 degrees): the phone may be tilted up or down by up to 60 degrees when tapping Re-centre (a normal 30-45 degree placement tilt is fine). 0.87 = 30 degrees (stricter), 0.3 = 72 degrees (forgiving).
const START_HINT='Stand on your start spot. Aim at the floor about 2 m ahead, toward where the exhibition should open, then tap.';

function page(ok){
  const n=(exh.layout||[]).length,many=getExhibitions(cfg).filter(x=>!x.unlisted).length>1;
  app.innerHTML=(isDraft?'<div class="card" style="border-color:var(--accent)"><b>Test run</b><div class="muted">This gallery is not saved. You are seeing it the way a visitor will. <a href="layout.html">Back to the gallery maker</a></div></div>':'')+`<h1>${esc(exh.name||'Exhibition')}</h1>
  <p class="muted">${esc(exh.description||'')}${exh.description?' · ':''}${n} exhibit${n===1?'':'s'} placed around you in the room.${exh.room&&exh.room.width>0&&exh.room.depth>0?' Needs a space of about '+(+exh.room.width)+' × '+(+exh.room.depth)+' m.':''}</p>
  <div class="card"><b>How it works</b><ol>
    <li>Stand on the marked start spot (or wherever you want the exhibition to begin).</li>
    <li>Tap the button below and allow the camera.</li>
    <li>Aim at the floor about 2 metres ahead, the way the exhibition should open, and tap once.</li>
    <li>Walk around and look at everything.</li></ol></div>
  ${ok?'<button class="go" id="go">Start exhibition</button>':'<div class="card">This needs an Android phone with Google AR support, using Chrome. iPhones are not supported in exhibition mode yet.</div>'}
  <p class="muted" style="margin-top:20px">${many?'<a href="exhibition.html">All exhibitions</a> · ':''}<a href="index.html">Preview mode: view single exhibits</a></p>`;
  const b=document.getElementById('go');if(b)b.onclick=()=>start(b);
}

async function start(btn){
  const label=btn.textContent;
  try{
    btn.disabled=true;
    const loader=new GLTFLoader(),items=[];
    let i=0;
    for(const L of exh.layout){
      const ex=cfg.exhibits.find(e=>e.id===L.exhibit);if(!ex)continue;
      btn.textContent='Loading '+(++i)+' of '+exh.layout.length+'…';
      let g,clips=[];
      try{const gl=await loader.loadAsync(ex.model);g=gl.scene;solid(g,ex);clips=gl.animations||[]}
      catch(err){throw new Error('could not load '+(ex.model.startsWith('data:')?ex.title+' (built-in)':new URL(ex.model,location.href).href))}
      items.push({L,ex,g,clips});
    }
    if(!items.length)throw new Error('no exhibits in the layout');
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,60);
    scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1.3));
    const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(1,3,2);scene.add(sun);
    const reticle=new THREE.Mesh(new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x44ddff}));
    reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
    const group=new THREE.Group();scene.add(group);
    // start-spot marker: only shown for a few seconds when a visitor is asked to walk back to the start spot
    const marker=new THREE.Group();marker.visible=false;
    marker.add(new THREE.Mesh(new THREE.RingGeometry(0.16,0.2,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x44ddff,side:THREE.DoubleSide})));
    const arrow=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.22,16).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x44ddff}));arrow.position.set(0,0.02,-0.34);marker.add(arrow);scene.add(marker);
    const state={group,placed:false,session:null,mixers:[],objs:[],base:null,fwd:new THREE.Vector3(),cam:null};cur=state;const clock=new THREE.Clock();

    // Position every exhibit from the stored start spot (base) and each exhibit's layout entry.
    state.markerUntil=0;
    state.showStart=()=>{marker.position.set(state.base.ox,state.base.oy+0.01,state.base.oz);marker.rotation.y=state.base.th;state.markerUntil=performance.now()+10000};
    state.layoutAll=()=>{
      const {ox,oy,oz,th}=state.base,fx=-Math.sin(th),fz=-Math.cos(th),rx=Math.cos(th),rz=-Math.sin(th);   // forward and right directions on the floor
      for(const {o,L,ex,minY,sc,sh,lbox} of state.objs){
        const x=+L.x||0,z=+L.z||0;
        o.position.set(ox+rx*x+fx*z,oy+(+L.y||0)-minY*sc,oz+rz*x+fz*z);   // rest the lowest point on the floor
        o.rotation.y=th+((+ex.rotation||0)+(+L.rotation||0))*Math.PI/180;   // model's own front fix + this layout spot's extra turn
        setShadow(sh,boxOf(o,lbox),oy+(+L.y||0));
      }
    };
    const controller=renderer.xr.getController(0);scene.add(controller);
    const ray=new THREE.Raycaster();
    controller.addEventListener('select',()=>{
      if(state.placed){   // after placing: tap a model to read about it; tap empty space to close the card
        const m=new THREE.Matrix4().extractRotation(controller.matrixWorld);
        ray.ray.origin.setFromMatrixPosition(controller.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m);
        const hits=ray.intersectObjects(state.objs.map(i=>i.o),true);
        let found=null;
        if(hits.length){let o=hits[0].object;while(o&&!found){found=state.objs.find(i=>i.o===o)||null;o=o.parent}}
        if(found)showInfo(found.ex);else hideInfo();
        return;
      }
      if(!reticle.visible)return;
      const hit=new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
      const cam=state.cam||renderer.xr.getCamera().getWorldPosition(new THREE.Vector3());   // phone position from the live AR pose
      let fx=hit.x-cam.x,fz=hit.z-cam.z;const len=Math.hypot(fx,fz);
      if(len<0.4){say('Aim a little further ahead (about 2 m), then tap.');return}
      fx/=len;fz/=len;
      const th=Math.atan2(-fx,-fz);
      state.base={ox:cam.x,oy:hit.y,oz:cam.z,th};                         // start spot = where you stand, floor height from the hit
      for(const {L,ex,g,clips} of items){
        const o=SkeletonUtils.clone(g);
        if(clips.length){const mx=new THREE.AnimationMixer(o);clips.forEach(c=>mx.clipAction(c).play());state.mixers.push(mx)}
        const bb=lowestY(o),minY=(ex.ground===false||!isFinite(bb))?0:bb;   // lowest point at full size
        const sc=(+ex.scale||1)*(+L.scale||1);o.scale.setScalar(sc);
        const sh=makeShadow();state.objs.push({o,L,ex,minY,sc,sh,lbox:skinnedBox(o)});group.add(o);group.add(sh);
      }
      state.layoutAll();
      state.placed=true;
      say('Exhibition placed. Walk around, and tap a model to read about it. If it drifts or looks off, stand on your start spot, face the way it should open, and tap “Re-centre”. If the floor height is wrong, tap Exit and start again.',12000);
    });

    ui.style.display='block';say(START_HINT);
    const session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:ui}});
    state.session=session;
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    const viewer=await session.requestReferenceSpace('viewer');
    const source=await session.requestHitTestSource({space:viewer});
    session.addEventListener('end',()=>{
      renderer.setAnimationLoop(null);ui.style.display='none';hideInfo();cur=null;renderer.dispose();
      btn.disabled=false;btn.textContent=label;
    });
    renderer.setAnimationLoop((t,frame)=>{
      if(frame){const vp=frame.getViewerPose(renderer.xr.getReferenceSpace());if(vp){const t=vp.transform.position,q=vp.transform.orientation;(state.cam||(state.cam=new THREE.Vector3())).set(t.x,t.y,t.z);state.fwd.set(0,0,-1).applyQuaternion(new THREE.Quaternion(q.x,q.y,q.z,q.w))}}
      if(frame&&!state.placed){
        const hits=frame.getHitTestResults(source);
        if(hits.length){const pose=hits[0].getPose(renderer.xr.getReferenceSpace());reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix)}
        else reticle.visible=false;
      }else if(state.placed)reticle.visible=false;
      marker.visible=performance.now()<state.markerUntil;
      const dt=clock.getDelta();state.mixers.forEach(mx=>mx.update(dt));
      renderer.render(scene,camera);
    });
  }catch(e){
    ui.style.display='none';cur=null;btn.disabled=false;btn.textContent=label;
    alert('Exhibition could not start.\n\nReason: '+(e&&e.message?e.message:e));
  }
}

(async()=>{
  let ok=false;
  try{ok=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar'))}catch(e){}
  try{cfg=await (await fetch('exhibits.json?t='+Date.now(),{cache:'no-store'})).json()}
  catch(e){app.textContent='Could not load exhibits.json. Is this page served over https?';return}
  if(new URLSearchParams(location.search).get('draft')){   // test run from the gallery maker
    let d=null;try{d=JSON.parse(sessionStorage.getItem('gm_draft'))}catch(e){}
    if(!d||!Array.isArray(d.layout)||!d.layout.length){app.innerHTML='<h1>Test run</h1><p class="muted">There is no test gallery to show. Open the gallery maker, place your models, then tap “Try it as a visitor”.</p><p><a href="layout.html">Back to the gallery maker</a></p>';return}
    exh=d;isDraft=true;document.title=(exh.name||'Gallery')+' (test)';page(ok);return;
  }
  const all=getExhibitions(cfg),want=new URLSearchParams(location.search).get('e');
  if(!all.length){app.innerHTML='<h1>Exhibition</h1><p class="muted">No exhibition has been set up yet.</p>';return}
  const listed=all.filter(x=>!x.unlisted);   // unlisted exhibitions are left out of the list but still open from their own link
  exh=want?all.find(x=>x.id===want):(listed.length===1?listed[0]:null);
  if(want&&!exh){app.innerHTML='<h1>Exhibition</h1><p class="muted">That exhibition was not found.</p><p><a href="exhibition.html">All exhibitions</a></p>';return}
  if(!exh&&!listed.length){app.innerHTML='<h1>Exhibition</h1><p class="muted">No exhibition has been set up yet.</p>';return}
  if(!exh){   // several exhibitions and none chosen: show a list
    document.title=cfg.museumName||'Exhibitions';
    app.innerHTML=`<h1>${esc(cfg.museumName||'Exhibitions')}</h1><p class="muted">Choose an exhibition.</p>`+listed.map(x=>`<div class="card"><b>${esc(x.name||x.id)}</b><div class="muted">${esc(x.description||'')}${x.description?' · ':''}${(x.layout||[]).length} exhibits</div><button class="go" data-e="${esc(x.id)}">Open</button></div>`).join('')+'<p class="muted" style="margin-top:20px"><a href="index.html">Preview mode: view single exhibits</a></p>';
    app.querySelectorAll('button[data-e]').forEach(bt=>bt.onclick=()=>{location.href='exhibition.html?e='+encodeURIComponent(bt.dataset.e)});
    return}
  document.title=exh.name||cfg.museumName||'Exhibition';
  page(ok);
})();
</script>
</body>
</html>
