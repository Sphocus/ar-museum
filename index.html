<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Museum</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#f4f1ea;--card:#fff;--text:#1f1d1a;--muted:#6d6860;--accent:#8c2f39;--line:#e2ddd3}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#232120;--text:#f2efe9;--muted:#a39e95;--accent:#e08a93;--line:#38352f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Georgia,serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.8rem;margin:0}h2{margin:0 0 4px}
.muted{color:var(--muted);font-family:system-ui,sans-serif;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{cursor:pointer}.b{padding:12px 14px}
model-viewer{width:100%;height:230px;--poster-color:transparent}
.big model-viewer{height:min(55vh,480px)}
.arbtn,.ar{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:13px 24px;font:600 1rem system-ui;cursor:pointer}
.ar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.arbtn{display:block;width:100%;margin-top:12px}
.arbtn:disabled{opacity:.6}
a{color:var(--accent);font-family:system-ui,sans-serif}
/* AR overlay (shown only while an AR session is running) */
#xr-ui{display:none;position:fixed;inset:0;pointer-events:none;color:#fff;font-family:system-ui,sans-serif}
#xr-hint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;text-align:center;background:rgba(0,0,0,.6);padding:10px 14px;border-radius:12px}
#xr-bar{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
#xr-bar button{font:600 15px system-ui;padding:12px 16px;border:0;border-radius:999px;background:rgba(0,0,0,.7);color:#fff}
#xr-bar button:disabled{opacity:.5}
#xr-list{display:none;position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-height:62vh;flex-direction:column;background:rgba(0,0,0,.88);border-radius:16px;padding:8px;pointer-events:auto}
#xr-list .lh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 8px;font-weight:700}
#xr-list .lh button{border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font:600 14px system-ui;padding:8px 14px}
#xl-items{overflow:auto}
#xl-items button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(255,255,255,.12);background:none;color:#fff;font:15px system-ui;padding:12px 8px}
</style>
</head>
<body>
<main id="app"></main>
<div id="xr-ui">
  <div id="xr-hint">Move your phone slowly over the floor or a table…</div>
  <div id="xr-bar">
    <button id="x-small">Smaller</button><button id="x-big">Bigger</button>
    <button id="x-rot">Rotate</button><button id="x-desel" style="display:none">Deselect</button><button id="x-add">Add model</button><button id="x-del">Remove</button><button id="x-exit">Exit</button>
  </div>
  <div id="xr-list"><div class="lh"><span>Choose a model</span><button id="xl-cancel">Cancel</button></div><div id="xl-items"></div></div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// Optional per-exhibit "solid": true stops see-through (blended) materials from showing parts of the model through each other.
const solid=(o,ex)=>{if(ex.solid)o.traverse(c=>{if(c.isMesh)[].concat(c.material).forEach(m=>{m.transparent=false;m.depthWrite=true;m.alphaTest=0.5;m.needsUpdate=true})})};
// Which animation a model plays. A file can hold many clips (and often a static pose first); playing them all at once would tangle the model.
// An exhibit's optional "animation" setting (a clip name, part of a name, or its number) wins; otherwise static/pose/very short clips are skipped and an idle-like one is preferred.
function pickClip(clips,ex){
  clips=clips||[];if(!clips.length)return[];
  if(clips.length===1&&!(ex&&ex.animation===false))return clips;   // a file with a single animation: just play it
  const want=ex&&ex.animation!=null&&ex.animation!==''?ex.animation:null;
  if(want!=null){
    if(typeof want==='number'||/^\d+$/.test(String(want))){const c=clips[+want];if(c)return[c]}
    const w=String(want).toLowerCase();
    const c=clips.find(x=>String(x.name||'').toLowerCase()===w)||clips.find(x=>String(x.name||'').toLowerCase().includes(w));if(c)return[c];
  }
  const skip=/(^|[^a-z])(static|tpose|t[-_ ]pose|bind|ref|reference|rest)([^a-z]|$)/i;
  const ok=clips.filter(x=>{const n=String(x.name||'').split('|').pop();return !(x.duration<0.2)&&(!skip.test(n)||/idle|stand|breath/i.test(n))});
  if(!ok.length)return[];
  return[ok.find(x=>/idle|stand|breath|loop|wait/i.test(String(x.name||'')))||ok[0]];
}
// Lowest point of a model at its current pose. Skinned (animated) models are measured on their real posed vertices, because a plain bounding box can be wrong for them.
function lowestY(o){o.updateMatrixWorld(true);let m=Infinity;const v=new THREE.Vector3();
  try{o.traverse(c=>{if(c.isSkinnedMesh&&c.applyBoneTransform){c.skeleton.update();const p=c.geometry.attributes.position;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.applyBoneTransform(i,v);v.applyMatrix4(c.matrixWorld);if(v.y<m)m=v.y}}else if(c.isMesh){const y=new THREE.Box3().setFromObject(c).min.y;if(y<m)m=y}})}catch(e){m=Infinity}
  if(!isFinite(m))m=new THREE.Box3().setFromObject(o).min.y;return m}
// Box of a model in its own space, measured on the real posed vertices of its skinned (animated) parts. Returns null for models with none.
// Three.js's built-in Box3 can be far too big for skinned models that are scaled (e.g. Bender at scale 2), so those are measured here.
function skinnedBox(o){let has=false;o.traverse(c=>{if(c.isSkinnedMesh&&c.applyBoneTransform)has=true});if(!has)return null;
  o.updateMatrixWorld(true);const box=new THREE.Box3(),v=new THREE.Vector3(),inv=o.matrixWorld.clone().invert();
  try{o.traverse(c=>{
    if(c.isSkinnedMesh&&c.applyBoneTransform){c.skeleton.update();const p=c.geometry.attributes.position;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.applyBoneTransform(i,v);v.applyMatrix4(c.matrixWorld).applyMatrix4(inv);box.expandByPoint(v)}}
    else if(c.isMesh)box.union(new THREE.Box3().setFromObject(c).applyMatrix4(inv));
  })}catch(e){return null}
  return box.isEmpty()?null:box}
const boxOf=(o,lbox)=>{if(lbox){o.updateMatrixWorld(true);return lbox.clone().applyMatrix4(o.matrixWorld)}return new THREE.Box3().setFromObject(o)};   // the model's box in the room, at its current size and position
// Soft shadow under a model: a dark, feathered ellipse lying flat at the model's lowest point, so it looks planted instead of floating.
let shadowTex=null;
function shadowTexture(){if(shadowTex)return shadowTex;const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(0,0,0,0.6)');r.addColorStop(0.45,'rgba(0,0,0,0.32)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);shadowTex=new THREE.CanvasTexture(c);return shadowTex}
function makeShadow(){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:shadowTexture(),transparent:true,depthWrite:false}));m.renderOrder=-1;m.visible=false;return m}
function setShadow(sh,box,floorY){   // box: the model's box in the room; floorY: height of its lowest point
  const sx=box.max.x-box.min.x,sz=box.max.z-box.min.z;
  if(!(sx>0&&sz>0&&isFinite(sx)&&isFinite(sz)&&isFinite(floorY))){sh.visible=false;return}
  const w=Math.max(0.25,sx*1.35),d=Math.max(0.25,sz*1.35);
  sh.scale.set(w,1,d);sh.position.set((box.min.x+box.max.x)/2,floorY+0.003,(box.min.z+box.max.z)/2);
  sh.material.opacity=Math.max(0.35,Math.min(1,3/Math.max(w,d)));   // very large models get a fainter shadow
  sh.visible=true}
let cfg={exhibits:[]},xrOK=false;
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- gallery / exhibit pages ---------- */
function render(){
  const id=location.hash.slice(1),ex=cfg.exhibits.find(e=>e.id===id);
  if(ex){
    // With WebXR (Android Chrome) we run our own surface-detection + tap-to-place AR (no Google viewer button: it only duplicated this).
    // Without it (iPhone, or an Android phone without WebXR) model-viewer's built-in AR (Quick Look / Scene Viewer) is used instead.
    const fallback='ar ar-modes="scene-viewer quick-look" ar-placement="floor" ar-scale="auto"';
    app.innerHTML=`<a href="#">← All exhibits</a>
    <div class="card big" style="position:relative;margin-top:10px">
      <model-viewer src="${esc(ex.model)}" ${ex.usdz?`ios-src="${esc(ex.usdz)}"`:''} alt="${esc(ex.title)}" camera-controls touch-action="pan-y" auto-rotate autoplay shadow-intensity="1" ${ex.rotation?`orientation="0deg 0deg ${+ex.rotation||0}deg"`:''} ${xrOK?'':fallback}>
        ${xrOK?'':'<button slot="ar-button" class="ar">View in your space</button>'}
      </model-viewer>
      <div class="b"><h2>${esc(ex.title)}</h2><div>${esc(ex.description)}</div>
      ${xrOK?`<button class="arbtn" id="go-ar">Place in your space</button>
      <p class="muted">Point your phone at the floor or a table. When a ring appears on the surface, tap to place the model. Tap elsewhere to move it.</p>`
      :`<p class="muted">Tap “View in your space”, point at the floor, then place the model.</p>`}</div></div>`;
    const b=document.getElementById('go-ar');if(b)b.onclick=()=>startAR(ex,b);
    const mv=app.querySelector('model-viewer'),st=document.createElement('p');st.className='muted';
    st.textContent='Model: loading… ('+(ex.model.startsWith('data:')?'built-in':new URL(ex.model,location.href).href)+')';
    app.querySelector('.b').appendChild(st);
    mv.addEventListener('load',()=>{st.textContent='Model: loaded OK'});
    mv.addEventListener('error',e=>{st.textContent='Model: FAILED to load ('+((e.detail&&e.detail.sourceError&&e.detail.sourceError.message)||'unknown')+')'});
  }else{
    app.innerHTML=`<h1>${esc(cfg.museumName||'AR Museum')}</h1><p class="muted">Scan an exhibit’s QR code, or pick one below, then place it in your space.</p>
    <div class="grid">${cfg.exhibits.filter(e=>!e.unlisted).sort((a,b)=>String(a.title||a.id).localeCompare(String(b.title||b.id),undefined,{sensitivity:'base',numeric:true})).map(e=>`<div class="card item" data-go="${esc(e.id)}"><model-viewer src="${esc(e.model)}" alt="${esc(e.title)}" auto-rotate autoplay interaction-prompt="none" style="pointer-events:none"></model-viewer><div class="b"><b>${esc(e.title)}</b><div class="muted">${esc((e.description||'').slice(0,80))}</div></div></div>`).join('')}</div>
    <p class="muted" style="margin-top:24px"><a href="qr.html">Printable QR codes</a> · <a href="credits.html">Credits</a></p>`;
    app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>location.hash=el.dataset.go);
  }
}

/* ---------- WebXR: detect surfaces (hit-test) and tap to place ---------- */
const ui=document.getElementById('xr-ui'),hint=document.getElementById('xr-hint');
let hintTimer=null;
// Show a message at the top. With ms it fades after that long so it does not block the view; without, it stays until replaced.
function say(t,ms){hint.textContent=t;hint.style.display='block';clearTimeout(hintTimer);if(ms)hintTimer=setTimeout(()=>{hint.style.display='none'},ms)}
const MAX_MODELS=4;            // most models a visitor can have out at once in preview mode
const MAX_BYTES=40e6;          // safety cap on the total download of the different models in use (only matters for very large models)
let cur=null; // current AR session state
['xr-bar','xr-list'].forEach(id=>document.getElementById(id).addEventListener('beforexrselect',e=>e.preventDefault())); // button taps must not place the model
document.getElementById('x-small').onclick=()=>cur&&cur.grow(1/1.2);
document.getElementById('x-big').onclick=()=>cur&&cur.grow(1.2);
document.getElementById('x-rot').onclick=()=>cur&&cur.rotate();
document.getElementById('x-del').onclick=()=>cur&&cur.remove();
document.getElementById('x-desel').onclick=()=>cur&&cur.deselect();
document.getElementById('x-add').onclick=()=>cur&&cur.openList();
document.getElementById('xl-cancel').onclick=()=>{document.getElementById('xr-list').style.display='none'};
document.getElementById('x-exit').onclick=()=>{if(cur)cur.session.end()};

async function startAR(ex,btn){
  const label=btn.textContent;
  try{
    btn.disabled=true;btn.textContent='Loading model…';
    const loader=new GLTFLoader(),cache=new Map();   // one download per different model, even if it is placed twice
    const getModel=e=>{
      if(!cache.has(e.id))cache.set(e.id,loader.loadAsync(e.model).then(gl=>{solid(gl.scene,e);return {template:gl.scene,clips:pickClip(gl.animations,e)}}));
      return cache.get(e.id).catch(err=>{cache.delete(e.id);throw err});
    };
    let first;
    try{first=await getModel(ex)}
    catch(err){throw new Error('could not load the model file at '+(ex.model.startsWith('data:')?'(built-in)':new URL(ex.model,location.href).href)+' ('+(err&&err.message?err.message:err)+')')}
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,30);
    scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1.3));
    const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(1,3,2);scene.add(sun);
    const reticle=new THREE.Mesh(new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x44ddff}));
    reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
    // yellow ring under the selected model (only drawn when there is more than one model)
    const selRing=new THREE.Mesh(new THREE.RingGeometry(0.92,1,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffd24a,depthTest:false,transparent:true,side:THREE.DoubleSide}));
    selRing.renderOrder=999;selRing.visible=false;scene.add(selRing);
    // items: the models placed so far. sel: the one the buttons act on. pending: a chosen model waiting for the next tap on a surface.
    const state={scene,items:[],sel:null,pending:{ex,m:first},busy:false,session:null,cam:null,sizes:new Map()};cur=state;const clock=new THREE.Clock();
    state.sizes.set(ex.id,0);
    const sizeOf=async e=>{try{const r=await fetch(e.model,{method:'HEAD'});const n=+r.headers.get('content-length');return isFinite(n)?n:0}catch(err){return 0}};
    sizeOf(ex).then(n=>state.sizes.set(ex.id,n));

    function buttons(){const b=document.getElementById('x-add');b.textContent='Add model ('+state.items.length+'/'+MAX_MODELS+')';b.disabled=state.busy||!state.items.length;
      ['x-small','x-big','x-rot','x-del'].forEach(id=>{document.getElementById(id).disabled=!state.sel});   // nothing selected: nothing for these to act on
      const d=document.getElementById('x-desel');d.style.display=state.items.length>1?'':'none';d.disabled=!state.sel}
    function ring(){
      const it=state.sel;if(!it||state.items.length<2){selRing.visible=false;return}
      const bb=boxOf(it.obj,it.lbox),sz=bb.getSize(new THREE.Vector3());
      selRing.scale.setScalar(Math.min(3,Math.max(0.15,Math.max(sz.x,sz.z)/2*0.9+0.05)));
      selRing.position.set(it.obj.position.x,it.baseY+0.01,it.obj.position.z);selRing.visible=true;
    }
    const rest=it=>{it.obj.position.y=it.baseY-(it.minY||0)*it.obj.scale.y};   // lowest point of the model on the surface
    function choose(it){state.sel=it;ring();buttons()}
    function addItem(e,m){
      const obj=SkeletonUtils.clone(m.template),b=lowestY(obj);
      const it={ex:e,m,obj,lbox:skinnedBox(obj),sh:makeShadow(),minY:(e.ground===false||!isFinite(b))?0:b,spin:0,baseY:0,mixer:null};   // minY: lowest point at full size
      if(m.clips.length){it.mixer=new THREE.AnimationMixer(obj);m.clips.forEach(c=>it.mixer.clipAction(c).play())}
      obj.scale.setScalar(+e.scale||1);scene.add(obj);scene.add(it.sh);state.items.push(it);return it;
    }
    function moveTo(it,p){
      const cam=state.cam||renderer.xr.getCamera().getWorldPosition(new THREE.Vector3());   // phone position from the live AR pose
      if(Math.hypot(cam.x-p.x,cam.z-p.z)>0.25){
        const yaw=Math.atan2(cam.x-p.x,cam.z-p.z);   // turn toward where the visitor stands, every time it is placed or moved
        it.obj.rotation.y=yaw+((+it.ex.rotation||0)*Math.PI/180)+it.spin;   // plus the model's own front fix and any manual Rotate
      }
      it.obj.position.copy(p);it.baseY=p.y;rest(it);ring();
    }
    state.deselect=()=>{state.sel=null;ring();buttons();say('Nothing selected. Tap a model to select it.',5000)};
    state.grow=f=>{const it=state.sel;if(!it)return;it.obj.scale.multiplyScalar(f);rest(it);ring()};
    state.rotate=()=>{const it=state.sel;if(!it)return;it.spin+=Math.PI/4;it.obj.rotation.y+=Math.PI/4};
    state.remove=()=>{
      const it=state.sel;if(!it)return;
      scene.remove(it.obj);scene.remove(it.sh);state.items.splice(state.items.indexOf(it),1);
      if(state.items.length){state.sel=state.items[state.items.length-1];say('Removed. '+state.items.length+' of '+MAX_MODELS+' models out.',5000)}
      else{state.sel=null;state.pending={ex:it.ex,m:it.m};say('Tap a surface to place the model.')}   // nothing left: the next tap puts it back, as Reset used to
      ring();buttons();
    };
    state.openList=()=>{
      if(state.items.length>=MAX_MODELS){say('That is the limit for preview mode ('+MAX_MODELS+' models). Remove one to add another.',6000);return}
      const l=document.getElementById('xl-items');
      l.innerHTML=cfg.exhibits.filter(e=>!e.unlisted||e.id===ex.id).sort((a,b)=>String(a.title||a.id).localeCompare(String(b.title||b.id),undefined,{sensitivity:'base',numeric:true})).map(e=>`<button data-id="${esc(e.id)}">${esc(e.title||e.id)}</button>`).join('');
      l.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(cfg.exhibits.find(e=>e.id===b.dataset.id)));
      document.getElementById('xr-list').style.display='flex';
    };
    async function pick(e){
      document.getElementById('xr-list').style.display='none';
      if(!e||state.busy)return;
      state.busy=true;buttons();say('Loading “'+(e.title||e.id)+'”…');
      try{
        if(!state.sizes.has(e.id))state.sizes.set(e.id,await sizeOf(e));
        const inUse=new Set(state.items.map(i=>i.ex.id));inUse.add(e.id);
        const total=[...inUse].reduce((a,id)=>a+(state.sizes.get(id)||0),0);
        if(total>MAX_BYTES){state.busy=false;buttons();say('Those models together are too large for preview mode (about '+Math.round(total/1e6)+' MB). Remove one first.',7000);return}
        const m=await getModel(e);
        state.pending={ex:e,m};state.busy=false;buttons();
        say('Aim at the floor or a table where “'+(e.title||e.id)+'” should go, then tap.');
      }catch(err){state.busy=false;buttons();say('Could not load that model: '+(err&&err.message?err.message:err),7000)}
    }

    const controller=renderer.xr.getController(0);scene.add(controller);
    const ray=new THREE.Raycaster();
    controller.addEventListener('select',()=>{
      if(state.busy)return;
      // With several models: tapping a different model selects it (tapping the selected one, or empty space, moves the selected one to the ring).
      if(!state.pending&&state.items.length>1){
        const m4=new THREE.Matrix4().extractRotation(controller.matrixWorld);
        ray.ray.origin.setFromMatrixPosition(controller.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m4);
        const hits=ray.intersectObjects(state.items.map(i=>i.obj),true);
        if(hits.length){let o=hits[0].object,f=null;while(o&&!f){f=state.items.find(i=>i.obj===o)||null;o=o.parent}
          if(f&&f!==state.sel){choose(f);say('Selected “'+(f.ex.title||f.ex.id)+'”. The buttons now act on it.',5000);return}}
      }
      if(!reticle.visible)return;
      const p=new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
      if(state.pending){
        const first=!state.items.length,it=addItem(state.pending.ex,state.pending.m);state.pending=null;
        moveTo(it,p);choose(it);
        say(first?'Placed. Tap elsewhere to move it (it turns to face you). Use the buttons to resize or rotate, or Add model for up to '+MAX_MODELS+'.':'Placed. Tap elsewhere to move it. Tap another model to select it.',9000);
        return;
      }
      if(state.sel)moveTo(state.sel,p);
    });
    ui.style.display='block';document.getElementById('xr-list').style.display='none';buttons();say('Move your phone slowly over the floor or a table…');
    const session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:ui}});
    state.session=session;
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    const viewer=await session.requestReferenceSpace('viewer');
    const source=await session.requestHitTestSource({space:viewer});
    session.addEventListener('end',()=>{
      renderer.setAnimationLoop(null);ui.style.display='none';cur=null;renderer.dispose();
      btn.disabled=false;btn.textContent=label;
    });
    const SURF='Surface found. Tap to place the model.',MOVE='Move your phone slowly over the floor or a table…';
    renderer.setAnimationLoop((t,frame)=>{
      if(frame){
        const vp=frame.getViewerPose(renderer.xr.getReferenceSpace());
        if(vp){const t=vp.transform.position;(state.cam||(state.cam=new THREE.Vector3())).set(t.x,t.y,t.z)}
        const hits=frame.getHitTestResults(source);
        if(hits.length){
          const pose=hits[0].getPose(renderer.xr.getReferenceSpace());
          reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix);
          if(!state.items.length&&hint.textContent!==SURF)say(SURF);   // only touch the page text when it actually changes (writing it every frame makes the AR overlay stutter)
        }else{reticle.visible=false;if(!state.items.length&&hint.textContent!==MOVE)say(MOVE)}
      }
      const dt=clock.getDelta();state.items.forEach(i=>{if(i.mixer)i.mixer.update(dt);setShadow(i.sh,boxOf(i.obj,i.lbox),i.obj.position.y+(i.minY||0)*i.obj.scale.y)});
      renderer.render(scene,camera);
    });
  }catch(e){
    ui.style.display='none';cur=null;
    btn.disabled=false;btn.textContent=label;
    alert('Tap-to-place AR could not start on this phone.\n\nReason: '+(e&&e.message?e.message:e)+'\n\nTry reloading the page, or use a different browser or phone.');
  }
}

/* ---------- start ---------- */
(async()=>{
  try{xrOK=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar'))}catch(e){xrOK=false}
  try{cfg=await (await fetch('exhibits.json?t='+Date.now(),{cache:'no-store'})).json();document.title=cfg.museumName||'AR Museum'}
  catch(e){app.textContent='Could not load exhibits.json. Is this page served over https?';return}
  render();
})();
window.addEventListener('hashchange',render);
</script>
